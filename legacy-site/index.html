<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Intelia Academy - Giriş</title>

  <link rel="stylesheet" href="./login.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

  <div class="login-page">

    <section class="login-left">

      <div class="brand-box">

        <img
          src="./assets/logo.png"
          alt="Intelia Academy"
          class="login-logo"
        >

        <h1>
          Intelia Academy
        </h1>

        <p>
          Kurs və tədris prosesini bir paneldən idarə et.
        </p>

      </div>


      <div class="feature-list">

        <div class="feature-item">

          <div class="feature-icon">
            <i class="fa-solid fa-user-graduate"></i>
          </div>

          <div>
            <strong>Tələbələr</strong>
            <span>Tələbə məlumatlarını idarə et</span>
          </div>

        </div>


        <div class="feature-item">

          <div class="feature-icon">
            <i class="fa-solid fa-users"></i>
          </div>

          <div>
            <strong>Qruplar</strong>
            <span>Dərs qruplarını və müəllimləri idarə et</span>
          </div>

        </div>


        <div class="feature-item">

          <div class="feature-icon">
            <i class="fa-solid fa-chart-line"></i>
          </div>

          <div>
            <strong>Hesabatlar</strong>
            <span>Ödəniş və fəaliyyət məlumatlarını izlə</span>
          </div>

        </div>

      </div>

    </section>


    <section class="login-right">

      <div class="login-card">

        <div class="login-heading">

          <span>
            İDARƏETMƏ PANELİ
          </span>

          <h2>
            Daxil ol
          </h2>

          <p>
            Intelia Academy admin hesabına daxil ol.
          </p>

        </div>


        <form id="loginForm">

          <div class="form-group">

            <label for="username">
              İstifadəçi adı
            </label>

            <div class="input-wrap">

              <i class="fa-regular fa-user"></i>

              <input
                id="username"
                type="text"
                placeholder="İstifadəçi adını daxil et"
                autocomplete="username"
                required
              >

            </div>

          </div>


          <div class="form-group">

            <label for="password">
              Şifrə
            </label>

            <div class="input-wrap">

              <i class="fa-solid fa-lock"></i>

              <input
                id="password"
                type="password"
                placeholder="Şifrənizi daxil edin"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Şifrəni göstər"
              >
                <i class="fa-regular fa-eye"></i>
              </button>

            </div>

          </div>


          <p
            id="loginError"
            class="login-error"
          ></p>


          <button
            type="submit"
            class="login-button"
          >
            <i class="fa-solid fa-right-to-bracket"></i>
            Daxil ol
          </button>

        </form>


        <div class="login-footer">
          <p>
            © 2026 Intelia Academy
          </p>
        </div>

      </div>

    </section>

  </div>


  <script src="./login.js"></script>

</body>
</html>
